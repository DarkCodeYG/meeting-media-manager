name: Custom Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this a failure on one OS cancels the other, so a Windows-only
      # problem also throws away a perfectly good macOS build.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install X11 development libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev

      - name: Install dependencies
        run: yarn install

      - name: Remove stale preload (macOS/Linux)
        if: runner.os != 'Windows'
        run: rm -f src-electron/electron-preload.cjs

      - name: Remove stale preload (Windows)
        if: runner.os == 'Windows'
        run: Remove-Item -Path src-electron/electron-preload.cjs -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Electron App
        run: |
          yarn generate:icons
          yarn generate:logos
          yarn build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_VERSION: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: M3-custom-${{ matrix.os == 'macos-latest' && 'macOS' || matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
          retention-days: 7
          path: |
            dist/electron/Packaged/*-x64.exe
            dist/electron/Packaged/*-universal.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          BODY=$(cat <<'RELEASE_BODY'
          ## 커스텀 빌드 v${VERSION}

          업스트림 [v26.4.7](https://github.com/sircharlo/meeting-media-manager/releases/tag/v26.4.7)까지의 변경사항을 반영한 포크 빌드입니다.

          > 이후 업스트림 릴리스(v26.5.0 이상)의 **기능은 포함되어 있지 않으며, 개별 버그 수정만 선별 반영**합니다. 그래서 버전이 업스트림 최신판을 따라가지 않습니다.

          ### ✨ 이번 빌드의 새 기능 (v26.4.7-custom.3)

          - **미디어 미리보기** — 재생 중인 미디어 창의 화면을 하단 조작 영역 위에 작은 창으로 보여줍니다. 두 번째 화면을 보지 않고도 무엇이 표시되고 있는지 확인할 수 있습니다. **기본값은 꺼져 있습니다** (미리보기는 재생과 별도로 화면을 한 번 더 처리하므로 컴퓨터에 부담이 됩니다). **설정 → 미디어 검색 및 재생** 또는 **화면 팝업의 토글**에서 켜세요

          ### 🐞 v26.4.7-custom.2 의 수정 사항

          업스트림이 이미 고쳐둔 수정들을 반영했습니다.

          - **회중 검색이 다시 동작합니다** — 회중 이름으로 검색해도 집회 시간을 가져오지 못했습니다. 앱 코드가 아니라 **JW 측 서버 주소가 2026년 5월 초에 변경**된 것이 원인이었습니다. 두 가지 참고 사항: 검색 목록에서 집회 시간 미리보기가 사라지고 회중 번호가 표시되며, 중국어 등 일부 언어는 자동 선택되지 않아 직접 지정해야 할 수 있습니다
          - **미디어가 오늘 날짜로 합쳐지던 문제 수정** — 내부 데이터 변환에서 날짜 정보가 손상되어 특정 날짜의 미디어가 오늘로 옮겨졌습니다
          - **캐시 정리가 직접 추가한 미디어를 삭제하던 문제 수정** — 미디어를 불러오는 중 캐시 정리가 실행되면, 예정된 집회를 위해 직접 추가해 둔 미디어를 사용하지 않는 파일로 판단해 지웠습니다
          - **그림이 일부만 표시되던 문제 수정** — 파수대 연구 기사 등에서 한 세트로 묶인 삽화 중 첫 장만 표시되고 나머지가 사라졌습니다
          - **삭제된 미디어를 다시 받지 않던 문제 수정** — 내려받은 파일을 지워도 그대로 있는 것으로 판단했습니다
          - **그래픽 오류 복구 개선** — 그래픽 오류가 반복될 때 앱이 예기치 않게 종료되는 대신 하드웨어 가속을 끈 상태로 스스로 재시작합니다

          ### 🐞 v26.4.7-custom.1 의 수정 사항

          - **수동 추가 영상의 자막이 나오지 않던 문제 수정** — 직접 추가한 영상은 자막이 들어 있어도 표시되지 않았습니다. 이제 영상 옆의 `.vtt`/`.srt` 파일을 인식하고, 없으면 영상에 내장된 자막을 꺼내어 표시합니다. 지금까지는 JW.org에서 자동으로 받은 미디어만 자막이 나왔습니다
          - **재생 성능 개선** — 영상을 재생할 때마다 매 프레임 도는 루프가 하나씩 쌓여, 모임이 진행될수록 CPU 사용량이 늘고 재생이 버벅였습니다. 재생이 끝난 영상은 더 이상 자원을 쓰지 않습니다
          - **타이머 창 동기화 수정** — 메인 창을 이동해도 타이머 창이 따라오지 않았습니다. v26.4.3-custom.0에서 추가되었다고 안내했으나 실제로는 연결되어 있지 않던 기능입니다
          - **파수대 그림 미디어 누락 수정** — 노래책이 설정되지 않은 경우 그림이 목록에서 빠질 수 있었습니다
          - **창 드래그 반응성 개선** — 창을 이동하는 동안 반복되던 불필요한 작업을 제거했습니다

          ### 🔒 보안 (업스트림 패치 이식)

          - **Zip Slip 경로 탈출 차단** — 조작된 `.jwpub`/`.zip` 파일이 지정된 폴더 밖에 파일을 쓸 수 있었습니다
          - **SQL 인젝션 차단** — 발행물 데이터 조회 쿼리를 파라미터 바인딩으로 변경했습니다
          - **신뢰 도메인 검사 강화** — `evil-jw.org` 처럼 신뢰 도메인으로 끝나기만 하는 유사 도메인이 신뢰된 것으로 통과했습니다. 화면 이동, 외부 링크 열기, 권한 요청, 요청 헤더에 모두 영향이 있었습니다

          ### 🛠️ 업스트림 버그 수정 및 개선 (v26.4.3 → v26.4.7)

          - **과거 날짜 미디어 오류 알림 수정** — 지난 집회 날짜에서 발생하는 빨간 오류 알림 제거 ([#7011](https://github.com/sircharlo/meeting-media-manager/pull/7011), [#7012](https://github.com/sircharlo/meeting-media-manager/pull/7012))
          - **기념식 미디어 처리 개선** — 기념식으로 대체된 주간/주말 집회 미디어 올바르게 처리, 기념식 날짜 보존 기간 수정 ([#7005](https://github.com/sircharlo/meeting-media-manager/pull/7005), [#7014](https://github.com/sircharlo/meeting-media-manager/pull/7014))
          - **기념식 배경음악 배너** — 기념식 날짜 선택 시 미디어 목록에 배경음악 항목 자동 추가
          - **다음 날 탐색 개선** — 당일 포함 여부 로직 수정 ([#7008](https://github.com/sircharlo/meeting-media-manager/pull/7008))
          - **베이스 URL 변경 시 캐시 우회** — 언어 변경 후 이전 캐시 요청 사용 방지 ([#7016](https://github.com/sircharlo/meeting-media-manager/pull/7016))
          - **네트워크 폴더 경고 알림** — 네트워크 드라이브 또는 공유 폴더 감지 시 사용자에게 알림 ([#7045](https://github.com/sircharlo/meeting-media-manager/pull/7045))
          - **JW 아이콘 폰트 폴백 수정** — 아이콘 폰트 로드 경쟁 조건 및 오프라인 폴백 개선 ([#7023](https://github.com/sircharlo/meeting-media-manager/pull/7023))
          - **CSP 보안 수정** — 잘못된 형식의 호스트명으로 인한 CSP 생성 오류 방지 ([#7072](https://github.com/sircharlo/meeting-media-manager/pull/7072))
          - **Fonts 폴더 초기화 마이그레이션** — 업그레이드 시 캐시된 폰트 파일 정리 ([#7021](https://github.com/sircharlo/meeting-media-manager/pull/7021))
          - **다운로드 큐 안정성 개선** — 큐 일시 중지/재개 제어, 복구 로직, 로깅 강화 ([#6995](https://github.com/sircharlo/meeting-media-manager/pull/6995), [#7017](https://github.com/sircharlo/meeting-media-manager/pull/7017), [#7019](https://github.com/sircharlo/meeting-media-manager/pull/7019))
          - **의존성 업데이트** — Electron 41.1.1, Quasar 2.19.3, Vue 3.5.32, DOMPurify 3.4.0, upath 3.0.6 등

          ### 🍴 포크 전용 기능

          - 모임 전 시계 및 카운트다운 타이머
          - 모임 전 안내 메시지
          - 강연 제목 표시, 연사 정보 입력
          - 베델 연사 방문 마련
          - 수동 추가 영상의 자막 지원 (사이드카 파일 및 내장 자막)

          ---

          ### 🍎 macOS 설치 방법 (서명되지 않은 앱)

          이 빌드는 Apple 공증을 받지 않아 처음 실행 시 "개발자를 확인할 수 없음" 경고가 표시될 수 있습니다.

          **방법 1 — 터미널 명령어 (권장)**

          DMG 마운트 후 터미널에서 아래 명령어 실행:

          \`\`\`sh
          xattr -d com.apple.quarantine /Applications/Meeting\ Media\ Manager.app
          \`\`\`

          또는 DMG 파일 자체의 격리 속성 제거 후 설치:

          \`\`\`sh
          xattr -d com.apple.quarantine ~/Downloads/meeting-media-manager-${VERSION}-universal.dmg
          \`\`\`

          **방법 2 — 시스템 설정에서 허용**

          1. DMG를 열고 앱을 Applications 폴더로 복사
          2. 앱 실행 시 경고 창이 뜨면 **취소** 클릭
          3. **시스템 설정 → 개인 정보 보호 및 보안 → 보안** 항목 하단에서 **"확인 없이 열기"** 클릭

          ---
          Built from commit ${SHA}
          RELEASE_BODY
          )

          BODY="${BODY//\$\{VERSION\}/$VERSION}"
          BODY="${BODY//\$\{SHA\}/$SHA}"

          # Delete existing release/tag if present
          gh release delete "v${VERSION}" --yes 2>/dev/null || true
          git push origin ":refs/tags/v${VERSION}" 2>/dev/null || true

          # Create new release with artifacts
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "$BODY" \
            --target "$SHA" \
            artifacts/**/*-x64.exe \
            artifacts/**/*-universal.dmg
