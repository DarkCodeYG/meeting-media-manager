name: Custom Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install X11 development libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev

      - name: Install dependencies
        run: yarn install

      - name: Build Electron App
        run: |
          yarn generate:icons
          yarn generate:logos
          yarn build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_VERSION: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: M3-custom-${{ matrix.os == 'macos-latest' && 'macOS' || matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
          retention-days: 7
          path: |
            dist/electron/Packaged/*-x64.exe
            dist/electron/Packaged/*-universal.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: v${{ steps.version.outputs.version }}
          tag: v${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          draft: false
          prerelease: false
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          removeArtifacts: true
          artifacts: 'artifacts/**/*-x64.exe,artifacts/**/*-universal.dmg'
          body: |
            ## 커스텀 빌드 v${{ steps.version.outputs.version }}

            업스트림 v26.4.3-beta.2까지의 변경사항을 반영한 포크 빌드입니다.

            ### 🛠️ 버그 수정 및 개선
            - 업스트림 v26.4.3-beta.2까지의 변경사항 반영
            - BrowserWindow 소멸 후 상태 업데이트 오류 수정
            - 미디어 창 위치 경계값 검증 추가
            - 타이머 창 위치 동기화 개선
            - lodash 보안 업데이트, Vue 3.5.32, Electron 41.1.1 등 의존성 업데이트

            ### 🍴 포크 전용 기능
            - 집회 전 시계 (Orbitron 폰트)
            - 베델 연사 방문 섹션 자동 생성
            - 한국어/중국어 번역

            ---
            Built from commit ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
