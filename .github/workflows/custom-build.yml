name: Custom Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Without this a failure on one OS cancels the other, so a Windows-only
      # problem also throws away a perfectly good macOS build.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install X11 development libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev

      - name: Install dependencies
        run: yarn install

      - name: Remove stale preload (macOS/Linux)
        if: runner.os != 'Windows'
        run: rm -f src-electron/electron-preload.cjs

      - name: Remove stale preload (Windows)
        if: runner.os == 'Windows'
        run: Remove-Item -Path src-electron/electron-preload.cjs -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Electron App
        run: |
          yarn generate:icons
          yarn generate:logos
          yarn build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_VERSION: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: M3-custom-${{ matrix.os == 'macos-latest' && 'macOS' || matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
          retention-days: 7
          path: |
            dist/electron/Packaged/*-x64.exe
            dist/electron/Packaged/*-universal.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          BODY=$(cat <<'RELEASE_BODY'
          ## 커스텀 빌드 v${VERSION}

          업스트림 [v26.4.7](https://github.com/sircharlo/meeting-media-manager/releases/tag/v26.4.7)까지의 변경사항을 반영한 포크 빌드입니다.

          > 이후 업스트림 릴리스(v26.5.0 이상)의 **기능은 포함되어 있지 않으며, 개별 버그 수정만 선별 반영**합니다. 그래서 버전이 업스트림 최신판을 따라가지 않습니다.

          ### 🐞 이번 빌드의 수정 사항 (v26.4.7-custom.12)

          - **연표어 화면의 JW 로고가 잘려 보이던 문제 수정** — 로고 오른쪽(W 부분)이 네모 상자에 걸려 잘렸습니다. 로고는 그림이 아니라 **아이콘 폰트의 글자 하나**를 상자 크기로 잘라내어 보여주는 방식이라, 글자를 그리는 폰트가 달라지면 잘리는 위치가 어긋납니다

            앱은 **예전 버전이 쓰던 구 폰트 파일(`JW-Icons`)이 남아 있으면 그것을 그대로 사용**했습니다. 이름만 다른 같은 폰트가 아니라 **글자 수가 적은 다른 폰트**여서 로고가 상자보다 크게 그려졌고, 게다가 이 파일이 있으면 **올바른 폰트를 새로 받지도 않았습니다**

            **Windows 에서 설치 시 "이 컴퓨터를 사용하는 모든 사람" 과 "전용" 중 이전과 다른 쪽을 고르면 이 문제가 드러납니다.** 선택에 따라 앱이 쓰는 데이터 폴더가 `C:\ProgramData\...` 와 `%APPDATA%\...` 사이에서 바뀌는데, 새로 쓰게 된 폴더에 아주 예전 파일이 남아 있으면 그것을 집어 듭니다. 2026년 3월에 같은 문제를 고친 적이 있지만 그때는 **한 번만 청소하는 방식**이어서, 폴더가 바뀌면 다시 나타났습니다

            이제 구 폰트 파일은 **앱을 켤 때마다 확인해 지웁니다.** 폴더가 바뀌어도 따라갑니다. 또한 폰트를 읽을 때 **내용이 올바른지 검사해**, 어떤 경로로든 엉뚱한 폰트가 들어오면 폐기하고 다시 받습니다

            > 이미 증상이 나타난 기기는 **업데이트만 하면 저절로 복구**됩니다. 폴더를 직접 지우실 필요는 없습니다

          ### 🐞 v26.4.7-custom.11 의 수정 사항

          **자막 네 건입니다.** 첫 번째는 자막 밖의 기능에도 영향을 미치던 것으로, macOS 와 Linux 에서만 나타났습니다.

          - **macOS·Linux 에서 FFmpeg 가 아예 실행되지 않던 문제 수정** — 앱이 스스로 내려받는 FFmpeg 는 압축을 풀 때 **실행 권한이 사라진 채로 저장**됐습니다(Windows 는 실행 권한이라는 개념이 없어 영향 없음). 그래서 **FFmpeg 를 쓰는 기능이 전부 조용히 실패**했습니다 — 영상에 들어 있는 자막 추출, 미디어 내보내기, 오디오·이미지를 영상으로 변환하기. 자막의 경우 실행 실패를 **"자막 트랙 없는 영상"과 구분하지 않아** 아무 표시 없이 넘어갔습니다

            **이미 망가진 설치도 앱을 다시 켜면 저절로 복구됩니다.** 다시 내려받거나 캐시를 지울 필요는 없습니다. 이 문제는 업스트림에도 그대로 있습니다

          - **직접 추가한 JW 영상이 공식 자막을 쓰지 않던 문제 수정** — JW 사이트에서 영상 파일만 받아 끌어다 놓으면, 앱은 **영상 안에 들어 있는 자막을 꺼내 썼습니다.** 내용은 같지만 **자막 위치 정보가 없습니다.** JW 가 따로 배포하는 자막 파일에는 화면 아래쪽 안내 문구와 겹치는 구간에서 **자막을 위로 올리라는 표시**가 들어 있는데, 영상 내장 자막에는 그 정보가 없어 전 구간 하단에 고정됐습니다. 집회 미디어로 받은 같은 영상은 정상이어서, **추가 방법에 따라 결과가 달라졌습니다**

            이제 **파일 이름에서 영상을 알아내 JW 의 공식 자막을 내려받습니다.** 같은 영상이면 집회 미디어와 똑같은 자막을 쓰게 됩니다. 옆에 자막 파일을 직접 두셨다면 그쪽이 우선이고, 둘 다 없을 때만 영상 내장 자막을 꺼냅니다

          - **자막 파일이 캐시에서 사라지면 영원히 나오지 않던 문제 수정** — 자막은 캐시 폴더에 저장되는데, **캐시가 정리되어 파일이 사라져도 항목은 그 주소를 계속 가리켰습니다.** 주소가 비어 있지 않다는 이유로 다시 찾아보지도 않아, **몇 번을 재생해도 자막이 나오지 않고** 삭제·재추가만이 방법이었습니다. 이제 파일이 실제로 있는지 확인하고, 사라졌으면 다시 찾습니다

          - **재생 중에 도착한 자막이 표시되지 않던 문제 수정** — 자막을 내려받거나 영상에서 꺼내는 데는 시간이 걸립니다. 그 사이 재생이 먼저 시작되면 **자막이 도착해도 화면에 나오지 않고**, 정지 후 다시 재생해야 보였습니다. 이제 도착하는 즉시 표시됩니다

          ### 🐞 v26.4.7-custom.10 의 수정 사항

          업스트림에서 **데이터가 지워지는 버그 두 건**만 가져왔습니다. 되돌리기 어려운 파일이 삭제되므로 먼저 반영했습니다.

          - **읽을 수 없는 발행물을 삭제하던 문제 수정** — `.jwpub` 을 열거나 압축 해제할 때 **권한 오류를 파일 손상과 똑같이 처리해 이미 내려받은 발행물을 삭제**했고, 다시 내려받아도 같은 폴더에 접근할 수 없어 반복됐습니다(네트워크 공유 폴더, 잠긴 폴더, 재연결 중인 드라이브). 이제 손상이 아니라 접근 문제일 때는 파일을 유지합니다. Windows 에서 압축 해제가 동시에 같은 폴더를 만들 때 실패하던 문제도 함께 고쳤습니다

          - **앱을 켤 때마다 모르는 회중의 저장 자료를 삭제하던 문제 수정** — 시작 시 **이 앱이 알지 못하는 회중 ID 의 추가 미디어·회중 설정·공개 강연 개요를 모두 삭제**했습니다. 회중 ID 는 설치본마다 따로 생성되므로 **캐시 폴더를 공유하면 서로의 자료를 지웁니다.** 이제 사용자가 직접 회중을 삭제할 때만 지웁니다

          ### 🐞 v26.4.7-custom.9 의 수정 사항

          - **자막을 켜도 이미 추가한 미디어에는 적용되지 않던 문제 수정** — 각 항목의 자막은 **추가·수집 시점에 한 번 정해지고 다시 검토되지 않았습니다.** 자막 설정이 꺼진 상태로 추가한 영상은 **몇 번을 다시 재생해도 자막이 나오지 않고** 삭제·재추가만이 방법이었습니다. 앱을 새로 설치하면 자막이 꺼진 상태로 시작하므로 그 전에 수집된 미디어가 전부 이 상태가 됩니다

            이제 **설정을 켜면 저장된 미디어를 다시 훑고**, 그래도 없는 항목은 **재생 시 백그라운드로 찾아** 다음 재생부터 나옵니다. 자동 수집 미디어는 다시 가져오며(자막을 다시 찾을 정보가 항목에 없어서), **직접 추가한 미디어는 유지됩니다**

          ### 🐞 v26.4.7-custom.8 의 수정 사항

          - **영상 출처에 따라 자막 위치가 달라지던 문제 수정** — JW 배포 자막은 모든 줄에 표시 위치가 지정되어 화면 아래쪽에서 살짝 위에 놓이는데, 앱이 직접 만든 자막(영상에서 꺼낸 것, `.srt` 변환)에는 지정이 없어 맨 아래에 붙었습니다. 한 집회에서 출처가 섞이면 자막이 위아래로 튀었습니다. 이제 앱이 만드는 자막에도 같은 위치를 넣습니다(이미 지정된 자막은 그대로 둡니다)

          - **회중 검색이 실패하면 앱이 멈춰 있던 문제 수정** — 검색 결과를 골랐는데 집회 정보가 오지 않으면 내부 상태가 걸린 채 남아, 창이 아무 설명 없이 그대로 있고 **회중 이름을 수정해도 수정으로 인식되지 않아 다음 자동 동기화가 덮어썼습니다.** 이제 상황을 알려주고, 서버 응답에 값이 빠져 있어도 견딥니다

          - **그래픽 오류 복구가 반복 재시작하던 문제 수정** — custom.2 의 자동 재시작이 세션 안에서만 횟수를 세어, 하드웨어 가속을 꺼도 오류가 계속 나는 환경(드라이버 문제, 가상 머신, 원격 데스크톱)에서 매번 재시작했습니다

          - **미디어 미리보기 크기 조절 후 첫 클릭이 먹지 않던 문제 수정**

          ### 🐞 v26.4.7-custom.7 의 수정 사항

          두 건 모두 custom.6 에 보고된 자막 문제입니다. **custom.6 의 수정으로는 해결되지 않았습니다** — 그때 고친 부분도 실제 결함이었지만, 보고된 파일은 이미 영상이 내려받아진 상태여서 그 지점을 통과하고 그 다음 단계에서 막혔습니다.

          - **JW 서버 목록에 없는 발행물의 자막을 찾지 못하던 문제 수정** — 앱이 자막을 JW 의 두 미디어 서버 중 **한쪽에서만** 찾고 있었는데, `.jwpub` 에 담긴 **미디어 목록형 발행물**(예: `S-418mp`)은 그쪽에 등록되어 있지 않습니다. 자막은 다른 쪽 서버에 정상적으로 있었습니다. 이제 첫 번째 서버에 없는 발행물만 두 번째 서버에서 찾습니다

          - **긴 영상을 추가한 직후 재생하면 자막이 안 나오던 문제 수정** — 영상 안에 들어 있는 자막을 꺼내는 작업은 긴 영상에서 수 분이 걸리고 재생은 그것을 기다리지 않습니다. 꺼내기가 끝나기 전에 재생하면 그 재생 내내 자막이 나오지 않았습니다. 이제 끝나는 즉시 재생 중인 영상에 전달됩니다. **이전에 추가해 둔 영상은 자막이 이미 저장되어 있으니 다시 재생하시면 나옵니다**

          > 재생 중에 붙은 자막이 즉시 표시되는지는 확인하지 못했습니다. 즉시 표시되지 않더라도 다시 재생하면 확실히 나옵니다.

          ### 🐞 v26.4.7-custom.6 의 수정 사항

          - **`.jwpub` 안의 영상에 자막이 나오지 않던 문제 수정** — `S-418mp-26_CHS_002.jwpub` 같은 파일을 드래그해 넣으면 JW Library 에서는 자막이 나오는데 M³ 에서는 안 나왔습니다. 자막을 찾는 코드가 **파일 경로**로 영상 여부를 판단했지만, 이런 publication 에서는 **영상의 파일 경로가 미리보기 이미지**라 조회가 아예 시도되지 않았습니다(서버에는 자막이 있었습니다). 보고해 주신 실제 파일과 서버 응답으로 확인했습니다

          - **초기 설정 이후에는 병음 노래 토글을 켤 수 없던 문제 수정** — **병음 노래 우선 재생** 설정이 숨겨져 있어 이것을 켜는 경로가 **초기 설정 마법사의 한 단계뿐**이었습니다. 그 단계를 놓치면 설정에서 폴더를 지정해도 아무 일이 일어나지 않고, 프로필을 지우지 않는 한 되돌릴 수 없었습니다. 이제 중국어 간체 회중에서 폴더 설정 옆에 함께 표시됩니다

          ### ℹ️ 함께 보고되었으나 아직 해결되지 않은 것

          - **최초 설정 직후 연표어가 표시되지 않는 문제** — **앱을 완전히 종료하고 다시 실행**하면 표시됩니다. v26.4.7-custom.0 에서도 재현되므로 최근 회중 검색 작업으로 생긴 문제가 아닙니다. 원인 미규명, 코드 수정 없음

          ### ⚠️ custom.2 로 집회 요일이 밀린 경우 (custom.5 안내 보완)

          custom.5 안내에서 "회중 이름을 수정한 경우 요일을 직접 지정해야 한다"고 했는데 **더 나은 방법이 있습니다.** 설정 → 회중 집회의 **"일정 동기화 활성화"** 버튼은 바로 그 경우에만 나타납니다. 이 버튼으로 회중을 다시 선택하면 요일이 올바르게 저장되고 자동 동기화도 함께 복구됩니다.

          ### 🐞 v26.4.7-custom.5 의 수정 사항

          - **집회 요일이 하루씩 밀려 저장되던 문제 수정** — custom.2에서 생긴 문제입니다. 서버는 요일을 **일요일부터** 세고 앱은 **월요일부터** 세는데 검색이 이 차이를 보정하지 못해, 목요일·일요일에 모이는 회중이 **금요일·월요일**로 저장되고 미디어 달력도 그대로 따라갔습니다 — 주말집회 항목이 월요일에, 주중집회 항목이 금요일에 생성되었습니다. 사전집회 시계도 하루 어긋났습니다

            ⚠️ **이미 저장된 요일은 자동으로 고쳐지지 않는 경우가 있습니다.** 자동 일정 업데이트가 켜져 있고 회중 이름을 직접 수정하지 않았다면 다음 동기화에서 바로잡힙니다. 그렇지 않다면 — **회중 이름을 수정한 경우 "집회 일정 새로 고침" 버튼으로도 되지 않습니다** — **설정 → 회중 집회에서 두 집회 요일을 직접 지정**해 주십시오

          ### 함께 보고되었으나 버그가 아니었던 것

          - **공개강연 연제 입력 카드가 안 보인 문제** — **설정의 "공개 강연 제목" 항목이 꺼져 있었습니다.** 이 항목이 꺼져 있으면 다른 조건과 무관하게 카드가 표시되지 않습니다
          - **연표어가 표시되지 않던 문제** — **앱을 완전히 종료하고 다시 실행**하면 해소됩니다. 실제 프로필 사본으로 확인한 결과 저장된 중국어 연표어가 정상이고 새로 실행한 미디어 창에서 제대로 표시되었습니다

          ### 🐞 v26.4.7-custom.4 의 수정 사항

          - **회중 검색이 설정된 언어를 바꿔버리던 문제 수정** — custom.2에서 생긴 문제입니다. 집회 언어가 앱의 언어 목록과 맞지 않으면 검색이 언어를 **영어로 바꿔버렸습니다.** 중국어 회중이 이에 해당했고(집회 언어가 구어 코드로 표기됨), 그 결과 **연표어가 표시되지 않고 병음 노래 토글 버튼도 사라졌습니다.** 이제 언어를 확실히 알아낸 경우에만 변경하며, 중국어 구어 코드를 간체 문자로 올바르게 연결합니다. 언어가 바뀌어 있다면 **설정에서 다시 지정**해 주십시오

          ### ✨ v26.4.7-custom.3 의 새 기능

          - **미디어 미리보기** — 재생 중인 미디어 창의 화면을 하단 조작 영역 위에 작은 창으로 보여줍니다. 두 번째 화면을 보지 않고도 무엇이 표시되고 있는지 확인할 수 있습니다. **기본값은 꺼져 있습니다** (미리보기는 재생과 별도로 화면을 한 번 더 처리하므로 컴퓨터에 부담이 됩니다). **설정 → 미디어 검색 및 재생** 또는 **화면 팝업의 토글**에서 켜세요

          ### 🐞 v26.4.7-custom.2 의 수정 사항

          업스트림이 이미 고쳐둔 수정들을 반영했습니다.

          - **회중 검색이 다시 동작합니다** — 회중 이름으로 검색해도 집회 시간을 가져오지 못했습니다. 앱 코드가 아니라 **JW 측 서버 주소가 2026년 5월 초에 변경**된 것이 원인이었습니다. 두 가지 참고 사항: 검색 목록에서 집회 시간 미리보기가 사라지고 회중 번호가 표시되며, 중국어 등 일부 언어는 자동 선택되지 않아 직접 지정해야 할 수 있습니다
          - **미디어가 오늘 날짜로 합쳐지던 문제 수정** — 내부 데이터 변환에서 날짜 정보가 손상되어 특정 날짜의 미디어가 오늘로 옮겨졌습니다
          - **캐시 정리가 직접 추가한 미디어를 삭제하던 문제 수정** — 미디어를 불러오는 중 캐시 정리가 실행되면, 예정된 집회를 위해 직접 추가해 둔 미디어를 사용하지 않는 파일로 판단해 지웠습니다
          - **그림이 일부만 표시되던 문제 수정** — 파수대 연구 기사 등에서 한 세트로 묶인 삽화 중 첫 장만 표시되고 나머지가 사라졌습니다
          - **삭제된 미디어를 다시 받지 않던 문제 수정** — 내려받은 파일을 지워도 그대로 있는 것으로 판단했습니다
          - **그래픽 오류 복구 개선** — 그래픽 오류가 반복될 때 앱이 예기치 않게 종료되는 대신 하드웨어 가속을 끈 상태로 스스로 재시작합니다

          ### 🐞 v26.4.7-custom.1 의 수정 사항

          - **수동 추가 영상의 자막이 나오지 않던 문제 수정** — 직접 추가한 영상은 자막이 들어 있어도 표시되지 않았습니다. 이제 영상 옆의 `.vtt`/`.srt` 파일을 인식하고, 없으면 영상에 내장된 자막을 꺼내어 표시합니다. 지금까지는 JW.org에서 자동으로 받은 미디어만 자막이 나왔습니다
          - **재생 성능 개선** — 영상을 재생할 때마다 매 프레임 도는 루프가 하나씩 쌓여, 모임이 진행될수록 CPU 사용량이 늘고 재생이 버벅였습니다. 재생이 끝난 영상은 더 이상 자원을 쓰지 않습니다
          - **타이머 창 동기화 수정** — 메인 창을 이동해도 타이머 창이 따라오지 않았습니다. v26.4.3-custom.0에서 추가되었다고 안내했으나 실제로는 연결되어 있지 않던 기능입니다
          - **파수대 그림 미디어 누락 수정** — 노래책이 설정되지 않은 경우 그림이 목록에서 빠질 수 있었습니다
          - **창 드래그 반응성 개선** — 창을 이동하는 동안 반복되던 불필요한 작업을 제거했습니다

          ### 🔒 보안 (업스트림 패치 이식)

          - **Zip Slip 경로 탈출 차단** — 조작된 `.jwpub`/`.zip` 파일이 지정된 폴더 밖에 파일을 쓸 수 있었습니다
          - **SQL 인젝션 차단** — 발행물 데이터 조회 쿼리를 파라미터 바인딩으로 변경했습니다
          - **신뢰 도메인 검사 강화** — `evil-jw.org` 처럼 신뢰 도메인으로 끝나기만 하는 유사 도메인이 신뢰된 것으로 통과했습니다. 화면 이동, 외부 링크 열기, 권한 요청, 요청 헤더에 모두 영향이 있었습니다

