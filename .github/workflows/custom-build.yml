name: Custom Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install X11 development libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxinerama-dev libx11-xcb-dev libxkbcommon-x11-dev libxss-dev libpng-dev libpng++-dev

      - name: Install dependencies
        run: yarn install

      - name: Build Electron App
        run: |
          yarn generate:icons
          yarn generate:logos
          yarn build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEST_VERSION: 'false'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: M3-custom-${{ matrix.os == 'macos-latest' && 'macOS' || matrix.os == 'windows-latest' && 'Windows' || 'Linux' }}
          retention-days: 7
          path: |
            dist/electron/Packaged/*-x64.exe
            dist/electron/Packaged/*-universal.dmg

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          name: v${{ steps.version.outputs.version }}
          tag: v${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          draft: false
          prerelease: false
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          removeArtifacts: true
          artifacts: 'artifacts/**/*-x64.exe,artifacts/**/*-universal.dmg'
          body: |
            ## Custom Build v${{ steps.version.outputs.version }}

            Built from commit ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
